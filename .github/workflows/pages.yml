name: Check, export & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"   # single source of truth for the engine version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        run: |
          ./scripts/install_godot.sh "$GODOT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Registry up to date
        run: python3 scripts/registry.py --check

      - name: Check hub + every game
        run: GODOT=godot ./scripts/check.sh all

      - name: Export the collection
        run: GODOT=godot ./scripts/export_web.sh

      - name: Browser smoke test (headless Chromium)
        run: |
          npm i --no-save playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/browser_check.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
